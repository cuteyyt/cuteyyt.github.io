# Site
title: blank
first_name: Youtan
middle_name: null
last_name: Yin
contact_note: Feel free to reach out.
description: >-
  Personal homepage of Youtan Yin, PhD student at Nanyang Technological University,
  working on 3D reconstruction and editing.
footer_text: >-
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with
  <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: youtan yin, 3D reconstruction, 3D editing, diffusion models, NTU
lang: en
icon: ntu.png
url: https://cuteyyt.github.io
baseurl: ""
last_updated: false

# Theme runtime and current page features
theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
navbar_fixed: true
footer_fixed: true
max_width: 930px
search_enabled: true
socials_in_search: true
posts_in_search: false
bib_search: true
back_to_top: true
serve_og_meta: true
serve_schema_org: false
og_image: https://cuteyyt.github.io/assets/img/prof_pic.jpg
enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: false
enable_math: false
enable_tooltips: false
enable_darkmode: true
enable_project_categories: false
enable_medium_zoom: true
enable_progressbar: true
enable_video_embedding: false
lazy_loading_images: true
imagemagick:
  enabled: false
newsletter:
  enabled: false
related_blog_posts:
  enabled: false

# Jekyll build
collections:
  news:
    output: false
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include:
- _pages
exclude:
- AGENTS.md
- output/
- deploy.sh
- Gemfile
- Gemfile.lock
- LICENSE
- vendor/
- node_modules/
- test-results/
- package.json
- package-lock.json
keep_files:
- CNAME
- .nojekyll
plugins:
- jekyll-3rd-party-libraries
- jekyll-cache-bust
- jekyll-email-protect
- jekyll-feed
- jekyll-link-attributes
- jekyll-minifier
- jekyll-regex-replace
- jekyll/scholar
- jekyll-sitemap
- jekyll-socials
- jekyll-terser
- al_folio_core
- al_icons
- al_img_tools
- al_search
sass:
  style: compressed
jekyll-minifier:
  compress_javascript: false
  # Sass and Tailwind already compress CSS; cssminify2 corrupts Tailwind v4 tokens.
  compress_css: false
  exclude:
  - robots.txt
terser:
  compress:
    drop_console: true

# Publication data and links
scholar:
  last_name:
  - Yin
  first_name:
  - Youtan
  - Y.
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
  - latex
  - smallcaps
  - superscript
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: '@*'
  group_by: year
  group_order: descending
filtered_bibtex_keywords:
- abbr
- abstract
- additional_info
- altmetric
- annotation
- arxiv
- award
- award_name
- bibtex_show
- blog
- code
- dimensions
- google_scholar_id
- hal
- html
- inspirehep_id
- pdf
- pmid
- poster
- preview
- selected
- slides
- supp
- video
- website
max_author_limit: 3
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude: null

# Libraries used by the current pages
third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c=
    url:
      css: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css
    version: 7.2.0
  academicons:
    integrity:
      css: sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw=
    url:
      css: https://cdn.jsdelivr.net/npm/academicons@{{version}}/css/academicons.min.css
    version: 1.9.5
  scholar-icons:
    integrity:
      css: sha256-VY3hHVj/hNX3fYG6wtbA6TcKJQl7+FthzGSyIB64klY=
    url:
      css: https://cdn.jsdelivr.net/npm/scholar-icons@{{version}}/css/scholar-icons.css
    version: 1.0.3
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap
  vanilla-back-to-top:
    integrity:
      js: sha256-uMJJ3EoTyfRBoTbR+lrfu1uRQ87RZG8AR3cVNuQVeFg=
    url:
      js: https://cdn.jsdelivr.net/npm/vanilla-back-to-top@{{version}}/dist/vanilla-back-to-top.min.js
    version: 7.2.1
